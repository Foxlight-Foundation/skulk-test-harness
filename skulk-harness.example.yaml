api_base_url: http://localhost:52415
request_timeout_s: 30
generation_timeout_s: 1800
stream_read_timeout_s: 120
placement_ready_timeout_s: 1800
placement_appearance_timeout_s: 300
store_download_timeout_s: 14400
store_delete_timeout_s: 30
poll_interval_s: 2
preview_settle_attempts: 8
# Optional release-qualification invariant. Executed runs refuse unless every
# eligible node (or every live node when no allowlist is set) advertises this
# resolved DATA transport in /state.
# required_data_transport: zenoh
# Optional configured-fleet inventory. Every friendly name must be present;
# placements are confined to these nodes and incidental fabric members are
# ignored.
# eligible_fleet_nodes:
#   - node-a
#   - node-b
output_dir: runs
model_sets_path: configs/model_sets.yaml
test_sets_path: configs/test_sets.yaml
cluster_nodes: {}

# Optional: coordinate exclusive access to a shared test fleet across multiple
# operators/agents. Off by default (omit this whole section for single-operator
# use). See the "Coordinating a shared fleet" section of the README.
# fleet_lock:
#   remote: git@github.com:your-org/your-coordination-repo.git
#   holder: operator-a
#   branch: main
#   path: coordination/fleet-lock.json
#   default_ttl_s: 1800
