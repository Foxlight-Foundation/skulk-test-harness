model_sets:
  store-smoke:
    name: store-smoke
    description: First model currently present in the configured Skulk model store.
    selectors:
      - source: store
        id_regex: ".*"
        max_models: 1

  store-all:
    name: store-all
    description: Every model currently present in the configured Skulk model store.
    selectors:
      - source: store
        id_regex: ".*"

  catalog-small-text:
    name: catalog-small-text
    description: Small text-generation candidates discovered from catalog/store metadata.
    selectors:
      - source: both
        id_regex: "(instruct|chat|qwen|llama|gemma|mistral|phi)"
        max_models: 5

  embeddings:
    name: embeddings
    description: Common sentence-transformer embedding smoke target.
    models:
      - sentence-transformers/all-MiniLM-L6-v2

  speech-tts:
    name: speech-tts
    description: Common text-to-speech targets resolved through Skulk's store.
    selectors:
      - source: both
        capabilities_any:
          - tts
        max_models: 2
      - source: both
        tags_any:
          - tts
        max_models: 2
      - source: both
        tasks_any:
          - TextToSpeech
        max_models: 2

  speech-tts-streaming:
    name: speech-tts-streaming
    description: Text-to-speech targets that explicitly advertise streaming support.
    selectors:
      - source: both
        capabilities_any:
          - tts
        require_audio_streaming: true
        max_models: 2
      - source: both
        tags_any:
          - tts
        require_audio_streaming: true
        max_models: 2
      - source: both
        tasks_any:
          - TextToSpeech
        require_audio_streaming: true
        max_models: 2

  speech-roundtrip-tts:
    name: speech-roundtrip-tts
    description: Text-to-speech targets suitable for the TTS-to-STT roundtrip suite.
    selectors:
      - source: both
        capabilities_any:
          - tts
        max_models: 1
      - source: both
        tags_any:
          - tts
        max_models: 1
      - source: both
        tasks_any:
          - TextToSpeech
        max_models: 1

  speech-stt:
    name: speech-stt
    description: Common speech-to-text targets resolved through Skulk's store.
    selectors:
      - source: both
        capabilities_any:
          - stt
        max_models: 2
      - source: both
        tags_any:
          - stt
        max_models: 2
      - source: both
        tasks_any:
          - SpeechToText
        max_models: 2

  speech-stt-realtime:
    name: speech-stt-realtime
    description: Speech-to-text targets that truthfully advertise realtime streaming sessions.
    selectors:
      - source: both
        capabilities_any:
          - stt
        require_audio_realtime: true
        max_models: 1
      - source: both
        tags_any:
          - stt
        require_audio_realtime: true
        max_models: 1
      - source: both
        tasks_any:
          - SpeechToText
        require_audio_realtime: true
        max_models: 1

  vision:
    name: vision
    description: Every model whose resolved catalog metadata declares vision input.
    selectors:
      - source: both
        capabilities_any:
          - vision

  served-spec-draft-simple:
    name: served-spec-draft-simple
    description: Models whose cards declare llama_server draft_simple speculation.
    selectors:
      - source: both
        id_regex: ".*"
        served_spec_types_any:
          - draft_simple

  served-spec-draft-eagle3:
    name: served-spec-draft-eagle3
    description: Models whose cards declare llama_server draft_eagle3 speculation.
    selectors:
      - source: both
        id_regex: ".*"
        served_spec_types_any:
          - draft_eagle3

  lanec-dialects:
    name: lanec-dialects
    description: Lane C follow-up - one model per tool-call dialect family across engines.
    models:
      - mlx-community/Qwen3.5-4B-MLX-4bit
      - mlx-community/Ministral-8B-Instruct-2410-4bit
      - mlx-community/Llama-3.2-3B-Instruct-4bit
      - mlx-community/gemma-4-e4b-it-8bit
      - unsloth/Qwen3.5-4B-GGUF
  post-merge-smoke:
    name: post-merge-smoke
    description: Post-merge cluster regression - one small model per engine lane (MLX, served GGUF, vLLM).
    models:
      - mlx-community/Qwen3.5-4B-MLX-4bit
      - unsloth/Qwen3.5-4B-GGUF
      - Qwen/Qwen3.6-27B-FP8
  post-merge-vllm:
    name: post-merge-vllm
    description: Post-merge vLLM lane cell (BF16 Qwen2.5 with the hermes parser pin).
    models:
      - Qwen/Qwen2.5-7B-Instruct
